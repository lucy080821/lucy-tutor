services:
  # 1. Backend Service (Node.js API)
  - type: web
    name: lucy-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Trang quản trị /administrator: khoá ký phiên đăng nhập admin (chuỗi ngẫu nhiên dài)
      - key: ADMIN_TOKEN_SECRET
        sync: false
      # "Nghe bài viết" ở /blog: giọng ElevenLabs "Trung" miền Nam (không đặt = dùng giọng trình duyệt)
      - key: ELEVENLABS_API_KEY
        sync: false
      # Tab "Mạng xã hội" ở /administrator: YouTube (OAuth, lấy token bằng backend/scripts/youtubeAuth.js) + Facebook Page
      - key: YT_CLIENT_ID
        sync: false
      - key: YT_CLIENT_SECRET
        sync: false
      - key: YT_REFRESH_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_TOKEN
        sync: false

  # 2. Frontend Service (Next.js Application)
  - type: web
    name: lucy-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: lucy-backend
          envVarKey: RENDER_EXTERNAL_URL
      # Xác minh Google Search Console / Bing Webmaster (chỉ phần content của thẻ meta, cần build lại khi đổi)
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false
